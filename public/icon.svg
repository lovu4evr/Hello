<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFE0" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#050505" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#111111" stroke="#00FFE0" stroke-opacity="0.3" stroke-width="4" />
  
  <!-- Outer Cyber Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00FFE0" stroke-width="3" stroke-opacity="0.2" stroke-dasharray="12 8" />
  
  <!-- Phoenix / Cyber Shield Emblem -->
  <g filter="url(#glow)">
    <!-- Wings / Crest -->
    <path d="M 256 90 L 330 190 L 390 170 L 350 260 L 410 270 L 320 360 L 256 420 L 192 360 L 102 270 L 162 260 L 122 170 L 182 190 Z" 
          fill="none" 
          stroke="url(#cyberCyan)" 
          stroke-width="12" 
          stroke-linejoin="round" />
    
    <!-- Inner Core Core Matrix -->
    <polygon points="256,160 300,230 256,310 212,230" fill="#00FFE0" fill-opacity="0.25" stroke="#00FFE0" stroke-width="6" />
    
    <!-- Center Core Dot -->
    <circle cx="256" cy="235" r="16" fill="#00FFE0" />
    <circle cx="256" cy="235" r="30" fill="none" stroke="#00FFE0" stroke-width="2" stroke-dasharray="4 4" />
  </g>
  
  <!-- Text Label -->
  <text x="256" y="465" font-family="monospace" font-size="28" font-weight="bold" fill="#00FFE0" text-anchor="middle" letter-spacing="4">ARGON 4.8</text>
</svg>
